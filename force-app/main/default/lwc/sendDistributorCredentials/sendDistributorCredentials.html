<template>
    <div class="page-container">

        <!-- Header -->
        <div class="page-header">
            <div>
                <div class="eyebrow">DISTRIBUTOR MANAGEMENT</div>
                <h1>Distributor Accounts</h1>
                <p class="subtitle">
                    Manage distributor access and account activation.
                </p>
            </div>

            <lightning-button
                label="Refresh"
                title="Refresh distributor list"
                icon-name="utility:refresh"
                onclick={handleRefresh}
                disabled={isLoading}>
            </lightning-button>
        </div>

        <!-- Summary Cards -->
        <div class="summary-grid">

            <div class="summary-card total-card">
                <div class="summary-icon">
                    <lightning-icon
                        icon-name="standard:account"
                        size="small"
                        alternative-text="Total distributors">
                    </lightning-icon>
                </div>

                <div class="summary-label">Total Distributors</div>
                <div class="summary-value">{totalDistributors}</div>
            </div>

            <div class="summary-card active-card">
                <div class="summary-icon">
                    <lightning-icon
                        icon-name="utility:success"
                        size="small"
                        alternative-text="Active distributors">
                    </lightning-icon>
                </div>

                <div class="summary-label">Active Accounts</div>
                <div class="summary-value">{activeDistributors}</div>
            </div>

            <div class="summary-card pending-card">
                <div class="summary-icon">
                    <lightning-icon
                        icon-name="utility:clock"
                        size="small"
                        alternative-text="Pending accounts">
                    </lightning-icon>
                </div>

                <div class="summary-label">Pending Login</div>
                <div class="summary-value">{pendingDistributors}</div>
            </div>

        </div>

        <!-- Search -->
        <div class="search-panel">
            <lightning-input
                type="search"
                label="Search distributors"
                variant="label-hidden"
                placeholder="Search by name, email, or contact number..."
                value={searchTerm}
                onchange={handleSearch}>
            </lightning-input>
        </div>

        <!-- Loading -->
        <template lwc:if={isLoading}>
            <div class="loading-container">
                <lightning-spinner
                    alternative-text="Loading distributors"
                    size="medium">
                </lightning-spinner>
            </div>
        </template>

        <!-- Error -->
        <template lwc:if={errorMessage}>
            <div class="error-panel">
                <lightning-icon
                    icon-name="utility:error"
                    size="small"
                    alternative-text="Error">
                </lightning-icon>

                <div>
                    <strong>Unable to load distributors</strong>
                    <p>{errorMessage}</p>
                </div>
            </div>
        </template>

        <!-- Distributor Table -->
        <template lwc:if={hasDistributors}>
            <div class="table-panel">

                <div class="table-header">
                    <div>
                        <h2>All Distributors</h2>
                        <p>Manage account status and login activation.</p>
                    </div>

                    <span class="record-count">
                        {filteredCount} records
                    </span>
                </div>

                <div class="table-scroll">
                    <table class="distributor-table">

                        <thead>
                            <tr>
                                <th>Distributor</th>
                                <th>Contact</th>
                                <th>Account Status</th>
                                <th>Login Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>

                        <tbody>
                            <template
                                for:each={filteredDistributors}
                                for:item="item">

                                <tr key={item.Id}>

                                    <td>
                                        <div class="distributor-cell">
                                            <div class="avatar">
                                                {item.initials}
                                            </div>

                                            <div class="distributor-info">
                                                <a
                                                    href={item.recordUrl}
                                                    target="_blank"
                                                    rel="noopener noreferrer"
                                                    class="distributor-name">
                                                    {item.Name}
                                                </a>

                                                <div class="email-text">
                                                    {item.Email__c}
                                                </div>
                                            </div>
                                        </div>
                                    </td>

                                    <td>
                                        <div class="contact-text">
                                           <lightning-formatted-phone value={item.Phone}> </lightning-formatted-phone>
                                        </div>
                                    </td>

                                    <td>
                                        <span class={item.accountStatusClass}>
                                            {item.Active__c}
                                        </span>
                                    </td>

                                    <td>
                                        <span class={item.loginStatusClass}>
                                            {item.Login_Status__c}
                                        </span>
                                    </td>

                                    <td>
                                        <div class="action-group">

                                            <lightning-button
                                                label={item.toggleButtonLabel}
                                                title={item.toggleButtonLabel}
                                                data-id={item.Id}
                                                data-active={item.isActive}
                                                class={item.toggleButtonClass}
                                                onclick={handleToggleStatus}
                                                disabled={isLoading}>
                                            </lightning-button>

                                            <lightning-button
                                                label="Send Credentials"
                                                title="Send activation email"
                                                icon-name="utility:email"
                                                data-id={item.Id}
                                                onclick={handleSendCredentials}
                                                disabled={item.sendDisabled}>
                                            </lightning-button>

                                        </div>
                                    </td>

                                </tr>

                            </template>
                        </tbody>

                    </table>
                </div>
            </div>
        </template>

        <!-- Empty State -->
        <template lwc:if={showEmptyState}>
            <div class="empty-state">

                <lightning-icon
                    icon-name="standard:account"
                    size="large"
                    alternative-text="No distributors">
                </lightning-icon>

                <h2>No distributors found</h2>

                <p>
                    No distributor accounts match your search.
                    Check your search term or create a Distributor Account.
                </p>

                <template lwc:if={searchTerm}>
                    <lightning-button
                        label="Clear Search"
                        onclick={handleClearSearch}>
                    </lightning-button>
                </template>

            </div>
        </template>

        <!-- Confirmation Modal -->
        <template lwc:if={showConfirmation}>
            <section
                role="dialog"
                tabindex="-1"
                aria-modal="true"
                aria-labelledby="confirmation-heading"
                class="slds-modal slds-fade-in-open">

                <div class="slds-modal__container confirmation-container">

                    <header class="slds-modal__header">
                        <h2
                            id="confirmation-heading"
                            class="slds-text-heading_medium">
                            {confirmationTitle}
                        </h2>
                    </header>

                    <div class="slds-modal__content slds-p-around_medium">
                        <p>{confirmationMessage}</p>
                    </div>

                    <footer class="slds-modal__footer">

                        <lightning-button
                            label="Cancel"
                            onclick={handleCancelConfirmation}
                            disabled={isLoading}>
                        </lightning-button>

                        <lightning-button
                            variant="brand"
                            label="Confirm"
                            onclick={handleConfirmStatusChange}
                            disabled={isLoading}
                            class="confirm-button">
                        </lightning-button>

                    </footer>

                </div>
            </section>

            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

    </div>
</template>
